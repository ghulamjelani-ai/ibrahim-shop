<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#0c7367"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ibrahim Traders"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="icon-192.png"></head><body>
<title>Ibrahim Mobile Traders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Offline shop manager — data saved on this device (no login). Gradient header + 5-tab bar; bottom-sheet forms; extra screens via menu. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f2f5f8; --fg:#101922; --muted:#5a6a78;
  --border:#e2e8ee; --primary:#0c7367; --primary-2:#0f8a7b; --primary-ink:#09554c; --primary-soft:#d6ede9;
  --accent:#b9690a; --accent-soft:#fbe7cc; --danger:#c93d3d; --danger-soft:#fbe1e1;
  --warn:#a97a00; --warn-soft:#f9edc9; --success:#1f8f5f; --success-soft:#d4efe1; --blue:#2563c9; --blue-soft:#dce7fb;
  --shadow:0 1px 2px rgba(16,25,34,.05),0 7px 20px rgba(16,25,34,.07); --shadow-sm:0 1px 2px rgba(16,25,34,.06);
  --r:16px; --r-sm:12px;
  --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --ff-d:var(--ff);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1318; --surface:#152028; --surface-2:#1b2932; --fg:#e8eff3; --muted:#90a2af;
  --border:#263742; --primary:#2bbaa7; --primary-2:#34c9b5; --primary-ink:#86e4d7; --primary-soft:#0e322e;
  --accent:#e9a141; --accent-soft:#35270f; --danger:#ef7474; --danger-soft:#371b1b;
  --warn:#dfac3b; --warn-soft:#332810; --success:#45c988; --success-soft:#10301e; --blue:#6fa0f5; --blue-soft:#182a44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 7px 22px rgba(0,0,0,.38); --shadow-sm:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1318; --surface:#152028; --surface-2:#1b2932; --fg:#e8eff3; --muted:#90a2af;
  --border:#263742; --primary:#2bbaa7; --primary-2:#34c9b5; --primary-ink:#86e4d7; --primary-soft:#0e322e;
  --accent:#e9a141; --accent-soft:#35270f; --danger:#ef7474; --danger-soft:#371b1b;
  --warn:#dfac3b; --warn-soft:#332810; --success:#45c988; --success-soft:#10301e; --blue:#6fa0f5; --blue-soft:#182a44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 7px 22px rgba(0,0,0,.38); --shadow-sm:0 1px 2px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ff);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;display:flex;flex-direction:column;min-height:100%}
h1,h2,h3{font-family:var(--ff-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
.tnum{font-variant-numeric:tabular-nums}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(135deg,var(--primary-2),var(--primary));
  color:#fff;padding-block:12px;box-shadow:0 3px 16px rgba(9,85,76,.3)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--primary-2);z-index:21}
.appbar-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:11px;max-width:600px;margin:0 auto}
.logo{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.17);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.logo svg{width:24px;height:24px}
.brand{min-width:0;flex:1}
.brand h1{font-size:16.5px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:1px 0 0;font-size:11.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:38px;height:38px;border-radius:11px;border:0;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;position:relative}
.hbtn svg{width:19px;height:19px}
.hbtn .pdot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#8ce0b3}
.hbtn .pdot.bad{background:#ff9a9a}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;padding-bottom:104px}
.view{display:flex;flex-direction:column;gap:14px;max-width:600px;margin:0 auto;animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.vhead h2{font-size:21px;font-weight:700}
.vhead .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.back{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:var(--muted);font-weight:600;font-size:13px;padding:2px 0;margin-bottom:-4px}
.back svg{width:17px;height:17px}

.banner{border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;font-weight:500;display:flex;gap:8px;align-items:flex-start;
  background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.b{background:var(--blue-soft);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 30%,transparent)}
.banner svg{width:16px;height:16px;flex:none;margin-top:1px}
.banner a{color:inherit;font-weight:700;cursor:pointer;text-decoration:underline}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.list{display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .lbl{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.tile .lbl svg{width:15px;height:15px}
.tile .val{font-family:var(--ff-d);font-size:22px;font-weight:700;line-height:1.12}
.tile .val small{font-size:12px;font-weight:600;color:var(--muted)}
.tile.p{background:var(--primary-soft);border-color:transparent}.tile.p .val,.tile.p .lbl{color:var(--primary-ink)}
.tile.a{background:var(--accent-soft);border-color:transparent}.tile.a .val,.tile.a .lbl{color:var(--accent)}
.tile.full{grid-column:1/-1}

.section-t{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:5px 2px 0;display:flex;justify-content:space-between;align-items:center}

.row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 13px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.row.tap{transition:transform .08s}.row.tap:active{transform:scale(.99)}
.row .avatar{width:38px;height:38px;border-radius:11px;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;flex:none;font-family:var(--ff-d);font-weight:700;font-size:15px;overflow:hidden}
.row .avatar svg{width:19px;height:19px}
.row .avatar img{width:100%;height:100%;object-fit:cover}
.row .main{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.row .ttl{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px 9px;align-items:center}
.row .right{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row .price{font-family:var(--ff-d);font-weight:700;font-size:15px}
.qty-big{font-family:var(--ff-d);font-weight:700;font-size:19px;line-height:1}
.qty-big small{font-size:11px;color:var(--muted);font-weight:600}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill svg{width:12px;height:12px}
.pill.loc{color:var(--fg)}
.pill.ok{background:var(--success-soft);color:var(--success)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.primary{background:var(--primary-soft);color:var(--primary-ink)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:12px;padding:11px 15px;font-weight:600;font-size:14px}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--primary);color:#fff;border-color:transparent}
.btn.acc{background:var(--accent);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.wa{background:#25d366;color:#fff;border-color:#25d366}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}
.btn-row>.btn{flex:1;min-width:120px}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-sm)}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:transparent;width:100%;color:var(--fg)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--primary);color:#fff;border-color:transparent}

.empty{text-align:center;padding:30px 18px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{width:52px;height:52px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center}
.empty .ic svg{width:26px;height:26px;color:var(--primary)}
.empty b{color:var(--fg);font-size:15px;font-family:var(--ff-d)}
.empty p{margin:0;font-size:13px;max-width:34ch}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:0 -2px 16px rgba(16,25,34,.07)}
.nav-in{display:flex;max-width:600px;margin:0 auto}
.nav button{flex:1;background:none;border:0;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--primary)}
.nav button.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.nav .badge{position:absolute;top:5px;left:calc(50% + 7px);min-width:16px;height:16px;padding:0 4px;background:var(--danger);color:#fff;border-radius:999px;font-size:9.5px;display:grid;place-items:center;font-weight:700}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,16,20,.5);opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.25,1);max-height:92vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 40px rgba(0,0,0,.25);max-width:600px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheet-h{padding:15px 18px 6px;display:flex;align-items:center;gap:10px;flex:none;position:relative}
.sheet-h::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:999px;background:var(--border)}
.sheet-h h3{font-size:17px;font-weight:700;flex:1}
.sheet-x{width:32px;height:32px;border-radius:10px;border:0;background:var(--surface-2);display:grid;place-items:center}
.sheet-x svg{width:17px;height:17px}
.sheet-b{overflow-y:auto;padding:6px 18px 20px;display:flex;flex-direction:column;gap:13px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px 12px;color:var(--fg);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{resize:vertical;min-height:60px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{flex:1;min-width:72px;border:1px solid var(--border);background:var(--surface-2);border-radius:11px;padding:10px 6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--primary);color:#fff;border-color:transparent}
.seg.acc button.on{background:var(--accent)}

.cart-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.cart-line:last-child{border-bottom:0}
.cart-line .ci{flex:1;min-width:0}
.cart-line .ci b{font-weight:600;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-line .ci span{font-size:12px;color:var(--muted)}
.ministep{display:flex;align-items:center;gap:2px}
.ministep button{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);font-size:17px;font-weight:700;color:var(--primary);display:grid;place-items:center}
.ministep span{min-width:24px;text-align:center;font-weight:700;font-size:14px}
.cart-line .lt{font-family:var(--ff-d);font-weight:700;min-width:62px;text-align:right;font-size:14px}
.total-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 0 2px;margin-top:4px;border-top:2px solid var(--border)}
.total-bar .t-l{font-size:13px;color:var(--muted);font-weight:600}
.total-bar .t-v{font-family:var(--ff-d);font-size:24px;font-weight:700;color:var(--primary-ink)}
:root[data-theme="dark"] .total-bar .t-v{color:var(--primary)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .total-bar .t-v{color:var(--primary)}}

.ac-item{padding:10px 12px;border-radius:11px;background:var(--surface-2);display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;border:1px solid transparent}
.ac-item:active{border-color:var(--primary)}
.ac-item .q{font-size:11.5px;color:var(--muted)}

.tagx{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 7px 6px 13px;font-size:13px;font-weight:600}
.tagx button{width:22px;height:22px;border-radius:50%;border:0;background:var(--border);color:var(--fg);display:grid;place-items:center;font-size:12px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--success);color:#fff}
.toast.err{background:var(--danger);color:#fff}

.detail-kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.detail-kv:last-child{border-bottom:0}
.detail-kv .k{color:var(--muted)}.detail-kv .v{font-weight:600;text-align:right}
.hint{font-size:12px;color:var(--muted)}
.center-load{display:flex;flex-direction:column;align-items:center;gap:12px;padding:50px 0;color:var(--muted)}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.receipt{background:var(--surface-2);border:1px dashed var(--border);border-radius:14px;padding:16px}
.receipt .rh{text-align:center;border-bottom:1px dashed var(--border);padding-bottom:10px;margin-bottom:8px}
.receipt .rh b{font-family:var(--ff-d);font-size:16px}
.receipt .rh span{display:block;font-size:11.5px;color:var(--muted)}
.menu-item{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--border);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.menu-item:last-child{border-bottom:0}
.menu-item .mi{width:40px;height:40px;border-radius:12px;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.menu-item .mi svg{width:20px;height:20px}
.menu-item b{font-weight:600;font-size:14.5px;display:block}
.menu-item span{font-size:12px;color:var(--muted)}
.ledger{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.ledger:last-child{border-bottom:0}
.ledger .lmain{flex:1;min-width:0}
.ledger .lmain b{font-size:13.5px;font-weight:600}
.ledger .lmain span{display:block;font-size:11.5px;color:var(--muted)}
.ledger .lamt{font-family:var(--ff-d);font-weight:700;text-align:right;font-size:14px;white-space:nowrap}
.slipimg{width:42px;height:42px;border-radius:9px;object-fit:cover;flex:none;border:1px solid var(--border)}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:18px}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.slip-prev img{width:100%;max-height:170px;object-fit:contain;border-radius:10px;background:var(--surface-2);margin-bottom:8px}
.itemphoto{width:52px;height:52px;border-radius:11px;object-fit:cover;flex:none;border:1px solid var(--border)}
.barchart{display:flex;align-items:flex-end;gap:6px;height:112px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.bar-wrap{width:100%;height:88px;display:flex;align-items:flex-end;justify-content:center}
.bar{width:68%;max-width:26px;background:linear-gradient(var(--primary-2),var(--primary));border-radius:5px 5px 0 0;min-height:2px}
.bar-lbl{font-size:10px;color:var(--muted);font-weight:600}
</style>

<div class="appbar"><div class="appbar-in">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="10" y1="18" x2="14" y2="18"/></svg></div>
  <div class="brand"><h1 id="brandName">Ibrahim Mobile Traders</h1><p id="brandSub">Mobile · Accessories · Easyload</p></div>

</div></div>

var DEF_CATS=['Glass/Cover','Charger/Cable','Panel/Screen','Handsfree','Battery','Mobile Set','SIM/Memory','Accessories','Other'];
var DEF_SVCS=['Easypaisa','JazzCash','UPaisa','Bank','Other'];

/* store name -> state key */
var SK={inventory:'inv',sales:'sales',repairs:'repairs',customers:'customers',txns:'txns',suppliers:'suppliers',supplierTx:'supplierTx',loadCos:'loadCos',loadTx:'loadTx',panels:'panels',accounts:'accounts',acctTx:'acctTx',udhaar:'udhaar',udhaarTx:'udhaarTx'};

var S={tab:'home',ready:false,storeErr:false,
  inv:[],sales:[],repairs:[],customers:[],txns:[],suppliers:[],supplierTx:[],loadCos:[],loadTx:[],panels:[],accounts:[],acctTx:[],udhaar:[],udhaarTx:[],settings:{},

var pendingSlip='';

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){n=Math.round(Number(n)||0);var neg=n<0;return (neg?'-Rs ':'Rs ')+Math.abs(n).toLocaleString('en-PK');}
function num(n){return (Number(n)||0).toLocaleString('en-PK');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function normPhone(p){return String(p||'').replace(/\D/g,'');}
function startOfDay(){var d=new Date();d.setHours(0,0,0,0);return d.getTime();}
function startOfMonth(){var d=new Date();d.setDate(1);d.setHours(0,0,0,0);return d.getTime();}
function isToday(ts){return ts>=startOfDay();}
function clockTime(ts){var d=new Date(ts);var h=d.getHours(),m=d.getMinutes();var ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+(m<10?'0':'')+m+' '+ap;}
function dateStr(ts){var d=new Date(ts);return d.getDate()+'/'+(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2);}
function todayStr(){return new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}
function sum(arr,f){var s=0;for(var i=0;i<arr.length;i++)s+=Number(f(arr[i]))||0;return s;}
function initial(name){name=(name||'').trim();return name?name[0].toUpperCase():'?';}
function idxOf(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return i;return -1;}

var toastT;
function toast(msg,kind){var t=$('toast');t.textContent=msg;t.className='toast on'+(kind?' '+kind:'');clearTimeout(toastT);toastT=setTimeout(function(){t.className='toast'+(kind?' '+kind:'');},2200);}

function sheet(title,bodyHTML,onMount){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=bodyHTML;$('scrim').classList.add('on');$('sheet').classList.add('on');if(onMount)onMount($('sheetBody'));}
function closeSheet(){$('scrim').classList.remove('on');$('sheet').classList.remove('on');}
$('scrim').onclick=closeSheet;$('sheetX').onclick=closeSheet;$('menuBtn').onclick=openMore;

/* ===== storage: IndexedDB with localStorage fallback ===== */
var DB=null,USE_IDB=false;
function openDB(){return new Promise(function(res,rej){
  if(!window.indexedDB){rej();return;}
  var r;try{r=indexedDB.open('ibrahimShop',2);}catch(e){rej();return;}
  r.onupgradeneeded=function(e){var db=e.target.result;STORES.forEach(function(s){if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'});});};
  r.onsuccess=function(e){DB=e.target.result;res();};
  r.onerror=function(){rej();};
  r.onblocked=function(){rej();};
});}
function idbAll(store){return new Promise(function(res){try{var tx=DB.transaction(store,'readonly');var rq=tx.objectStore(store).getAll();rq.onsuccess=function(){res(rq.result||[]);};rq.onerror=function(){res([]);};}catch(e){res([]);}});}
function idbGet(store,id){return new Promise(function(res){try{var tx=DB.transaction(store,'readonly');var rq=tx.objectStore(store).get(id);rq.onsuccess=function(){res(rq.result||null);};rq.onerror=function(){res(null);};}catch(e){res(null);}});}
function idbPut(store,obj){return new Promise(function(res,rej){try{var tx=DB.transaction(store,'readwrite');tx.objectStore(store).put(obj);tx.oncomplete=function(){res();};tx.onerror=function(){rej();};}catch(e){rej();}});}
function idbDel(store,id){return new Promise(function(res,rej){try{var tx=DB.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=function(){res();};tx.onerror=function(){rej();};}catch(e){rej();}});}
function idbClear(store){return new Promise(function(res){try{var tx=DB.transaction(store,'readwrite');tx.objectStore(store).clear();tx.oncomplete=function(){res();};tx.onerror=function(){res();};}catch(e){res();}});}
function lsWrite(name){try{localStorage.setItem('ims_'+name,JSON.stringify(S[SK[name]]));}catch(e){S.storeErr=true;setStatus();toast('Jagah kam — purana data backup kar ke kam karein','err');}}

function loadAll(){
  if(USE_IDB){
    return Promise.all(Object.keys(SK).map(function(name){return idbAll(name).then(function(a){S[SK[name]]=a;});})).then(function(){
      return idbGet('settings','app').then(function(st){S.settings=st||{};});
    });
  }
  Object.keys(SK).forEach(function(name){try{S[SK[name]]=JSON.parse(localStorage.getItem('ims_'+name)||'[]');}catch(e){S[SK[name]]=[];}});
  try{S.settings=JSON.parse(localStorage.getItem('ims_settings')||'{}');}catch(e){S.settings={};}
  return Promise.resolve();
}
function save(name,obj){
  var a=S[SK[name]];var i=idxOf(a,obj.id);if(i>-1)a[i]=obj;else a.push(obj);
  if(USE_IDB)return idbPut(name,obj).catch(function(){toast('Save fail','err');});
  lsWrite(name);return Promise.resolve();
}
function removeDoc(name,id){
  S[SK[name]]=S[SK[name]].filter(function(x){return x.id!==id;});
  if(USE_IDB)return idbDel(name,id).catch(function(){});
  lsWrite(name);return Promise.resolve();
}
function saveSettings(patch){
  S.settings=Object.assign({},S.settings,patch);
  if(USE_IDB)return idbPut('settings',Object.assign({id:'app'},S.settings)).catch(function(){});
  try{localStorage.setItem('ims_settings',JSON.stringify(S.settings));}catch(e){}
  return Promise.resolve();
}
function initStore(){
  openDB().then(function(){USE_IDB=true;return loadAll();},function(){USE_IDB=false;return loadAll();}).then(finishInit,function(){S.storeErr=true;USE_IDB=false;loadAll().then(finishInit);});
}
function finishInit(){S.ready=true;applyBrand();setStatus();render();}
function applyBrand(){$('brandName').textContent=shopName();$('brandSub').textContent=shopSub();}
function setStatus(){var d=$('pdot');if(d)d.className='pdot'+(S.storeErr?' bad':'');}

/* settings-derived */
function getCats(){var c=S.settings.categories;return (c&&c.length)?c:DEF_CATS;}
function getSvcs(){var c=S.settings.services;return (c&&c.length)?c:DEF_SVCS;}
function shopName(){return S.settings.shopName||'Ibrahim Mobile Traders';}
function shopSub(){return S.settings.shopSub||'Mobile · Accessories · Easyload';}

/* finders */
function findInv(id){return S.inv[idxOf(S.inv,id)]||null;}
function findRep(id){return S.repairs[idxOf(S.repairs,id)]||null;}
function findTxn(id){return S.txns[idxOf(S.txns,id)]||null;}
function findCust(id){return S.customers[idxOf(S.customers,id)]||null;}
function findSup(id){return S.suppliers[idxOf(S.suppliers,id)]||null;}
function findCo(id){return S.loadCos[idxOf(S.loadCos,id)]||null;}
function custByPhone(p){p=normPhone(p);if(!p)return null;for(var i=0;i<S.customers.length;i++)if(normPhone(S.customers[i].phone)===p)return S.customers[i];return null;}

/* derived */
function inRange(ts,range){if(range==='today')return ts>=startOfDay();if(range==='month')return ts>=startOfMonth();return true;}
function todaySales(){return S.sales.filter(function(s){return isToday(s.ts);});}
function todayTxns(){return S.txns.filter(function(t){return isToday(t.ts);});}
function lowStock(){return S.inv.filter(function(i){return Number(i.qty)<=Number(i.lowAt||0);});}
function pendingRepairs(){return S.repairs.filter(function(r){return r.status!=='delivered';});}
function supBalance(sid){var tx=S.supplierTx.filter(function(t){return t.supId===sid;});return sum(tx.filter(function(t){return t.type==='purchase';}),function(t){return t.amount;})-sum(tx.filter(function(t){return t.type==='payment';}),function(t){return t.amount;});}
function totalSupDue(){return sum(S.suppliers,function(s){var b=supBalance(s.id);return b>0?b:0;});}
function coBalance(cid){var tx=S.loadTx.filter(function(t){return t.coId===cid;});return sum(tx,function(t){return Number(t.moneyGiven)||0;})-sum(tx,function(t){return Number(t.loadGot)||0;});}
function totalLoadGot(){return sum(S.loadTx,function(t){return Number(t.loadGot)||0;});}
function customerLoadSold(){return sum(S.txns.filter(function(t){return t.type==='load';}),function(t){return t.amount;});}
function availableLoad(){return totalLoadGot()-customerLoadSold();}
function coPendingTotal(){return sum(S.loadCos,function(c){var b=coBalance(c.id);return b>0?b:0;});}

/* ===== RENDER ===== */
function render(){
  var nav=$('navIn');[].forEach.call(nav.children,function(b){b.classList.toggle('on',b.getAttribute('data-tab')===S.tab);});
  updateBadge('repair',pendingRepairs().length);updateBadge('panels',S.panels.filter(function(p){return Number(p.qty)<=0;}).length);
  var v=$('view');
  if(!S.ready){v.innerHTML='<div class="center-load"><div class="spin"></div><div>App taiyar ho rahi hai…</div></div>';return;}
  var map={home:viewHome,stock:viewStock,panels:viewPanels,sale:viewSale,repair:viewRepair,service:viewService,customers:viewCustomers,suppliers:viewSuppliers,loadcos:viewLoadCos,accounts:viewAccounts,udhaar:viewUdhaar,reports:viewReports,settings:viewSettings};
  v.innerHTML=(map[S.tab]||viewHome)();
}
function updateBadge(tab,n){var btn=document.querySelector('.nav button[data-tab="'+tab+'"]');if(!btn)return;var b=btn.querySelector('.badge');if(n>0){if(!b){b=document.createElement('span');b.className='badge';btn.appendChild(b);}b.textContent=n>99?'99+':n;}else if(b)b.remove();}
function goTab(t){S.tab=t;S.stockQ='';S.custQ='';S.panelQ='';S.udQ='';render();var m=document.querySelector('main');if(m)m.scrollTop=0;}
function subHead(title){return '<button class="back" data-act="go" data-id="home">'+I.chevL+' Home</button><div class="vhead"><div><h2>'+esc(title)+'</h2></div></div>';}
function empty(ic,title,msg){return '<div class="empty"><div class="ic">'+ic+'</div><b>'+esc(title)+'</b><p>'+esc(msg)+'</p></div>';}

/* ---- HOME ---- */

  var ts=todaySales(),tt=todayTxns();

  var comm=sum(tt,function(t){return t.commission;});

  h+='<div class="vhead"><div><h2>Assalam-o-Alaikum 👋</h2><div class="sub">'+esc(todayStr())+'</div></div></div>';
  h+='<div class="tiles">';
  h+=tile('p',I.cart,'Aaj ki Bikri',money(saleTotal),ts.length+' sale');
  h+=tile('a',I.coin,'Aaj Commission',money(comm),tt.length+' transaction');
  h+=tile('',I.wrench,'Pending Repair',pend.length,'kaam baqi');
  h+=tile('',I.alert,'Low Stock',low.length,'item kam');
  h+='</div>';
  if(coPend.length){
    h+='<div class="banner b">'+I.tower+'<div>Load company se lena baqi: <b>'+money(coPendingTotal())+'</b>. '+coPend.map(function(c){return esc(c.name);}).join(', ')+' — <a data-act="go" data-id="loadcos">kholein</a></div></div>';
  }

  if(udLena>0||supDena>0){h+='<div class="tiles">'+tile('',I.coin,'Lena hai',money(udLena),'logon se')+tile('',I.truck,'Dena hai',money(supDena),'supplier ko')+'</div>';}
  h+='<div class="btn-row"><button class="btn pri" data-act="go" data-id="sale">'+I.cart+' New Sale</button><button class="btn acc" data-act="go" data-id="service">'+I.coin+' Load / Transfer</button></div>';
  h+='<div class="btn-row"><button class="btn" data-act="go" data-id="panels">'+I.grid+' Model dhoondein</button><button class="btn" data-act="go" data-id="stock">'+I.box+' Stock</button></div>';
  h+='<div class="btn-row"><button class="btn" data-act="go" data-id="customers">'+I.users+' Customers</button><button class="btn" data-act="go" data-id="udhaar">'+I.coin+' Udhaar Khata</button></div>';
  if(low.length){
    h+='<div class="section-t"><span>Low stock — jaldi mangwayein</span></div><div class="list">';
    low.slice(0,5).forEach(function(i){h+='<button class="row tap" data-act="editItem" data-id="'+i.id+'"><div class="main"><div class="ttl">'+esc(i.name)+'</div><div class="meta"><span class="pill loc">'+I.pin+esc(i.loc||'—')+'</span></div></div><div class="right"><div class="qty-big" style="color:var(--danger)">'+num(i.qty)+' <small>baqi</small></div></div></button>';});
    h+='</div>';
  }
  var acts=recentActivity();
  h+='<div class="section-t"><span>Aaj ki activity</span></div>';
  if(acts.length){h+='<div class="list">';acts.forEach(function(a){h+=actRow(a);});h+='</div>';}
  else h+=empty(I.clock,'Aaj abhi kuch nahi','Sale, repair ya load add karte hi yahan dikhega.');
  h+='</div>';return h;
}
function recentActivity(){
  var a=[];
  todaySales().forEach(function(s){a.push({ts:s.ts,type:'sale',title:(s.items.length)+' item bikri',amt:s.total});});
  todayTxns().forEach(function(t){a.push({ts:t.ts,type:'txn',title:t.service+' '+(t.type==='send'?'Send':t.type==='receive'?'Receive':'Load'),amt:t.amount,comm:t.commission});});
  S.repairs.filter(function(r){return isToday(r.ts);}).forEach(function(r){a.push({ts:r.ts,type:'rep',title:(r.device||'Repair')+' — '+(r.customer||''),amt:r.charges});});
  a.sort(function(x,y){return y.ts-x.ts;});return a.slice(0,8);
}
function actRow(a){
  var ic=a.type==='sale'?I.cart:a.type==='txn'?I.coin:I.wrench;
  var right=a.type==='txn'?('<div class="price" style="color:var(--accent)">+'+money(a.comm)+'</div><div class="meta tnum">'+money(a.amt)+'</div>'):('<div class="price">'+money(a.amt)+'</div>');
  return '<div class="row"><div class="avatar">'+ic+'</div><div class="main"><div class="ttl">'+esc(a.title)+'</div><div class="meta">'+clockTime(a.ts)+'</div></div><div class="right">'+right+'</div></div>';
}

/* ===== extra finders + derived (panels, accounts, udhaar) ===== */
function findPanel(id){return S.panels[idxOf(S.panels,id)]||null;}
function findAcct(id){return S.accounts[idxOf(S.accounts,id)]||null;}
function findUd(id){return S.udhaar[idxOf(S.udhaar,id)]||null;}
function acctBalance(aid){
  var ac=findAcct(aid);if(!ac)return 0;
  var open=Number(ac.opening)||0;
  var man=sum(S.acctTx.filter(function(t){return t.acctId===aid;}),function(t){return t.dir==='in'?Number(t.amount):-Number(t.amount);});
  var tr=sum(S.txns.filter(function(t){return t.acctId===aid;}),function(t){return t.type==='receive'?Number(t.amount):(t.type==='send'?-Number(t.amount):0);});
  return open+man+tr;
}
function totalAcct(){return sum(S.accounts,function(a){return acctBalance(a.id);});}
function acctLedger(aid){
  var rows=[];
  S.acctTx.filter(function(t){return t.acctId===aid;}).forEach(function(t){rows.push({ts:t.ts,label:t.dir==='in'?'Cash daala':'Cash nikala',delta:t.dir==='in'?Number(t.amount):-Number(t.amount),note:t.note,kind:'acctTx',id:t.id});});
  S.txns.filter(function(t){return t.acctId===aid&&(t.type==='send'||t.type==='receive');}).forEach(function(t){rows.push({ts:t.ts,label:(t.service||'Transfer')+' '+(t.type==='send'?'Send':'Receive'),delta:t.type==='receive'?Number(t.amount):-Number(t.amount),note:t.phone,kind:'txn',id:t.id});});
  rows.sort(function(a,b){return b.ts-a.ts;});return rows;
}
function udBalance(pid){var tx=S.udhaarTx.filter(function(t){return t.pid===pid;});return sum(tx.filter(function(t){return t.type==='gave';}),function(t){return t.amount;})-sum(tx.filter(function(t){return t.type==='got';}),function(t){return t.amount;});}
function totalUdhaarDue(){return sum(S.udhaar,function(p){var b=udBalance(p.id);return b>0?b:0;});}
function totalUdhaarOwe(){return sum(S.udhaar,function(p){var b=udBalance(p.id);return b<0?-b:0;});}

  else if(!list.length){h+=empty(I.search,'Kuch nahi mila','Koi aur naam ya number try karein.');}
  else{h+='<div class="list">';list.forEach(function(p){var bal=udBalance(p.id);var col=bal>0?'var(--success)':bal<0?'var(--danger)':'var(--muted)';h+='<button class="row tap" data-act="openUd" data-id="'+p.id+'"><div class="avatar">'+esc(initial(p.name))+'</div><div class="main"><div class="ttl">'+esc(p.name)+'</div><div class="meta">'+(p.phone?'<span class="pill">'+I.phone+esc(p.phone)+'</span>':'<span>number nahi</span>')+'</div></div><div class="right"><div class="price tnum" style="color:'+col+'">'+money(Math.abs(bal))+'</div><div class="meta" style="color:'+col+';font-weight:700">'+(bal>0?'LENA':bal<0?'DENA':'CLEAR')+'</div></div></button>';});h+='</div>';}

function pickItemSheet(){
  var avail=S.inv.filter(function(i){return Number(i.qty)>0;}).sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
  var body='<div class="search">'+I.search+'<input id="pickSearch" placeholder="Item dhoondein…" autofocus></div><div id="pickList" class="list" style="margin-top:4px"></div>';
  if(!avail.length)body=empty(I.box,'Stock mein kuch nahi','Pehle Stock tab mein item add karein, ya "Khula item" use karein.');
  sheet('Stock se item',body,function(root){
    if(!avail.length)return;
    function draw(q){q=(q||'').toLowerCase();var l=avail.filter(function(i){return i.name.toLowerCase().indexOf(q)>-1;});root.querySelector('#pickList').innerHTML=l.length?l.map(function(i){return '<div class="ac-item" data-pick="'+i.id+'"><div><b>'+esc(i.name)+'</b><div class="q">'+esc(i.loc||'')+' · '+num(i.qty)+' pcs</div></div><div class="price tnum">'+money(i.price)+'</div></div>';}).join(''):'<div class="hint" style="text-align:center;padding:16px">Kuch nahi mila</div>';}
    draw('');
    root.querySelector('#pickSearch').addEventListener('input',function(e){draw(e.target.value);});
    root.querySelector('#pickList').addEventListener('click',function(e){var el=e.target.closest('[data-pick]');if(el)addToCart(el.getAttribute('data-pick'));});
  });
}
function addToCart(itemId){
  var it=findInv(itemId);if(!it)return;
  var inCart=S.cart.filter(function(l){return l.itemId===itemId;})[0];var have=Number(it.qty);
  if(inCart){if(inCart.qty>=have){toast('Sirf '+have+' pcs stock mein','err');return;}inCart.qty++;}
  else S.cart.push({itemId:itemId,name:it.name,price:Number(it.price),cost:Number(it.cost||0),qty:1,max:have});
  closeSheet();toast(it.name+' add','good');render();
}
function customItemSheet(){sheet('Khula item (bina stock)','<div class="field"><label>Item / kaam ka naam *</label><input id="c_name" placeholder="e.g. Screen guard lagwai" autofocus></div><div class="two"><div class="field"><label>Rate Rs *</label><input id="c_price" type="number" inputmode="numeric" placeholder="0"></div><div class="field"><label>Quantity</label><input id="c_qty" type="number" inputmode="numeric" value="1"></div></div><button class="btn pri block" data-act="addCustom">'+I.plus+' Cart mein add karein</button>');}
function addCustom(){
  var name=$('c_name').value.trim();var price=Number($('c_price').value);var qty=Math.max(1,Math.floor(Number($('c_qty').value)||1));
  if(!name){toast('Naam likhein','err');return;}if(!(price>=0)||$('c_price').value===''){toast('Rate likhein','err');return;}
  S.cart.push({itemId:null,name:name,price:price,cost:0,qty:qty});closeSheet();toast('Add ho gaya','good');render();
}
function checkout(){
  if(!S.cart.length)return;
  var total=sum(S.cart,function(l){return l.price*l.qty;});
  var on=document.querySelector('#paySeg button.on');var pay=on?on.getAttribute('data-pay'):'Cash';
  var phoneEl=$('salePhone');var phone=phoneEl?phoneEl.value.trim():'';
  var items=S.cart.map(function(l){return {itemId:l.itemId,name:l.name,price:l.price,cost:l.cost||0,qty:l.qty};});
  var sale={id:uid(),ts:Date.now(),items:items,total:total,pay:pay||'Cash',phone:phone};
  var chain=Promise.resolve();
  S.cart.filter(function(l){return l.itemId;}).forEach(function(l){var it=findInv(l.itemId);if(it){it.qty=Math.max(0,Number(it.qty)-l.qty);chain=chain.then(function(){return save('inventory',it);});}});
  chain.then(function(){return save('sales',sale);}).then(function(){if(phone)upsertCustomer('',phone);S.cart=[];toast('Bikri mukammal — '+money(total),'good');S.tab='sale';render();}).catch(function(){toast('Masla hua','err');});
}

  var s=S.sales[idxOf(S.sales,id)];if(!s)return;
  var b='<div class="receipt"><div class="rh"><b>'+esc(shopName())+'</b><span>'+esc(S.settings.shopPhone||shopSub())+'</span><span>'+dateStr(s.ts)+' · '+clockTime(s.ts)+'</span></div>';
  s.items.forEach(function(it){b+='<div class="detail-kv"><span class="k">'+esc(it.name)+' × '+it.qty+'</span><span class="v tnum">'+money(it.price*it.qty)+'</span></div>';});

function compressImg(file,cb){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){try{var max=1100;var sc=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.6));}catch(e){cb(r.result);}};img.onerror=function(){cb(r.result);};img.src=r.result;};r.onerror=function(){toast('Photo load nahi hui','err');};r.readAsDataURL(file);}

/* ---- backup / restore ---- */
function backup(){
  try{
    var data={app:'ibrahim-shop',ver:1,when:Date.now(),settings:S.settings,data:{}};
    Object.keys(SK).forEach(function(n){data.data[n]=S[SK[n]];});
    var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    var url=URL.createObjectURL(blob);var a=document.createElement('a');
    a.href=url;a.download='ibrahim-shop-backup-'+dateStr(Date.now()).replace(/\//g,'-')+'.json';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    toast('Backup file ban gayi — mehfooz rakhein','good');
  }catch(e){toast('Backup is browser mein block hai — downloaded app use karein','err');}
}
function restore(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){
    var d;try{d=JSON.parse(r.result);}catch(e){toast('Galat file','err');return;}
    if(!d||!d.data){toast('Ye backup file nahi','err');return;}
    confirmSheet('Restore karein?','Is file ka data aa jayega aur mojooda data uski jagah le lega.','Haan, restore',function(){doRestore(d);});
  };r.readAsText(f);};inp.click();
}
function doRestore(d){
  Object.keys(SK).forEach(function(n){S[SK[n]]=(d.data&&d.data[n])||[];});
  S.settings=d.settings||{};
  var done=function(){applyBrand();closeSheet();toast('Restore mukammal','good');S.tab='home';render();};
  if(USE_IDB){
    Promise.all(Object.keys(SK).map(function(n){return idbClear(n);})).then(function(){
      var ps=[];Object.keys(SK).forEach(function(n){S[SK[n]].forEach(function(o){ps.push(idbPut(n,o));});});
      ps.push(idbPut('settings',Object.assign({id:'app'},S.settings)));
      return Promise.all(ps);
    }).then(done,done);
  }else{Object.keys(SK).forEach(function(n){lsWrite(n);});try{localStorage.setItem('ims_settings',JSON.stringify(S.settings));}catch(e){}done();}
}

  var name,phone,amt;
  if(kind==='ud'){var p=findUd(id);if(!p)return;name=p.name;phone=p.phone;amt=udBalance(id);}
  else{var c=findCust(id);if(!c)return;name=c.name;phone=c.phone;amt=sum(custRepairs(c).filter(function(r){return r.status!=='delivered';}),function(r){return Number(r.charges||0)-Number(r.advance||0);});}
  if(amt<=0){toast('Koi baqi nahi','err');return;}
  var msg='Assalam o Alaikum'+(name?' '+name:'')+',\n'+shopName()+' ki taraf se yaad-dahani: aap ke zimme Rs '+Math.round(amt).toLocaleString('en-PK')+' baqi hai. Meharbani kar ke jald ada kar dein. Shukriya.'+(S.settings.shopPhone?'\n— '+S.settings.shopPhone:'');
  waOpen(phone,msg);
}
function waRepair(id){
  var r=findRep(id);if(!r)return;var bal=Number(r.charges||0)-Number(r.advance||0);
  var line=r.status==='done'?'aap ka '+(r.device||'mobile')+' tayyar hai, dukaan se le ja sakte hain.':r.status==='delivered'?'shukriya, dobara zaroor aayein.':'aap ke '+(r.device||'mobile')+' par kaam chal raha hai.';
  var msg='Assalam o Alaikum'+(r.customer?' '+r.customer:'')+',\n'+shopName()+': '+line+(bal>0&&r.status!=='delivered'?' Baqi Rs '+Math.round(bal).toLocaleString('en-PK')+'.':'');
  waOpen(r.phone,msg);
}
function waReceipt(id){
  var s=S.sales[idxOf(S.sales,id)];if(!s)return;
  var msg=shopName()+'\nReceipt — '+dateStr(s.ts)+' '+clockTime(s.ts)+'\n'+s.items.map(function(it){return '• '+it.name+' x'+it.qty+' = Rs '+Math.round(it.price*it.qty).toLocaleString('en-PK');}).join('\n')+'\nTotal: Rs '+Math.round(s.total).toLocaleString('en-PK')+' ('+(s.pay||'Cash')+')\nShukriya!';
  waOpen(s.phone,msg);
}
function waTxn(id){
  var t=findTxn(id);if(!t)return;if(!normPhone(t.phone)){toast('Is lenden par number nahi','err');return;}
  var ty=t.type==='send'?'Send':t.type==='receive'?'Receive':'Load';
  var msg='Assalam o Alaikum'+(t.custName?' '+t.custName:'')+',\n'+shopName()+': '+(t.service||'')+' '+ty+' Rs '+Math.round(t.amount).toLocaleString('en-PK')+' mukammal ho gaya. Shukriya.'+(S.settings.shopPhone?'\n— '+S.settings.shopPhone:'');
  waOpen(t.phone,msg);
}
function waCo(id){
  var c=findCo(id);if(!c)return;if(!normPhone(c.phone)){toast('Company ka number nahi','err');return;}
  var bal=coBalance(id);
  var msg='Assalam o Alaikum'+(c.name?' '+c.name:'')+',\n'+shopName()+(bal>0?': aap ke zimme Rs '+Math.round(bal).toLocaleString('en-PK')+' ka load karna baqi hai. Meharbani kar ke kar dein. Shukriya.':' se raabta.');
  waOpen(c.phone,msg);
}
function waSup(id){
  var s=findSup(id);if(!s)return;if(!normPhone(s.phone)){toast('Supplier ka number nahi','err');return;}
  var bal=supBalance(id);
  var msg='Assalam o Alaikum'+(s.name?' '+s.name:'')+',\n'+shopName()+(bal>0?': aap ka Rs '+Math.round(bal).toLocaleString('en-PK')+' baqi hai, jald ada kar doonga. Shukriya.':' se raabta.');
  waOpen(s.phone,msg);
}
function salesChart(){
  var days=[],today=startOfDay();
  for(var i=6;i>=0;i--){var d0=today-i*86400000,d1=d0+86400000;var tot=sum(S.sales.filter(function(s){return s.ts>=d0&&s.ts<d1;}),function(s){return s.total;});days.push({d:new Date(d0),tot:tot});}
  var max=Math.max(1,Math.max.apply(null,days.map(function(x){return x.tot;})));
  var dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var bars=days.map(function(x){var hh=Math.round(x.tot/max*100);return '<div class="bar-col"><div class="bar-wrap"><div class="bar" style="height:'+(x.tot>0?Math.max(hh,4):2)+'%" title="'+money(x.tot)+'"></div></div><div class="bar-lbl">'+dn[x.d.getDay()]+'</div></div>';}).join('');
  var wk=sum(days,function(x){return x.tot;});
  return '<div class="section-t"><span>Pichle 7 din — bikri</span><span class="tnum" style="color:var(--primary-ink);font-weight:700">'+money(wk)+'</span></div><div class="card pad"><div class="barchart">'+bars+'</div></div>';
}
